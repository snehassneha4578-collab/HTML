<!DOCTYPE html>

<html>

<head>

<title>Feedback Form</title>

</head>

<body>

<h1>Feedback Form</h1>

<form>

<label>Name:</label>

<input type="text">

<br><br>

<label>Email:</label>

<input type="email">

<br><br>

<label>Rating:</label>

<select>

<option selected>Excellent</option>

<option>Good</option>

<option>Average</option>

<option>Poor</option>

</select>

<br><br>

<label>Feedback:</label>

<br>

<textarea rows="5" cols="30" placeholder="Enter your feedback"></textarea>

<br><br>

<input type="submit" value="Submit">

</form>

</body>

</html>
