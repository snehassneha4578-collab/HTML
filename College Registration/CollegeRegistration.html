<!DOCTYPE html>

<html>

<head>

<title>Student Form</title>

</head>

<body>

<h1>College Registration Form</h1>


<form>


<label>Name:</label>

<input type="text">

<br><br>


<label>Branch:</label>

<select>

<option selected>
ECE
</option>

<option>
CSE
</option>

<option>
EEE
</option>

<option>
ME
</option>

</select>


<br><br>


<label>Skills:</label>

<select multiple>

<option>
C
</option>

<option>
C++
</option>

<option>
Python
</option>

<option>
HTML
</option>

</select>


<br><br>


<label>Address:</label>

<br>

<textarea rows="5"
cols="30"
placeholder="Enter your address">

</textarea>


<br><br>


<input type="submit"
value="Register">


<input type="reset">


</form>


</body>

</html>
