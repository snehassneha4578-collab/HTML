<!DOCTYPE html>

<html>

<head>

<title>Audio and Video</title>

</head>

<body>


<h1>HTML Multimedia</h1>


<h2>Audio Example</h2>


<audio controls>

<source src="song.mp3"
type="audio/mpeg">

</audio>


<br><br>


<h2>Video Example</h2>


<video width="500"
height="300"
controls>

<source src="video.mp4"
type="video/mp4">

</video>


</body>

</html>
